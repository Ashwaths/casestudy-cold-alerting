spring:
  security:
    oauth2:
      client:
        registration:
          azure:
            provider: azure
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          azure:
            authorization-uri: https://login.microsoftonline.com/test-tenant/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/test-tenant/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/test-tenant/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub
  datasource:
    url: jdbc:h2:mem:nimbus;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
