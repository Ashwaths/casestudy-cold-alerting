server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:azure}
  application:
    name: nimbus-temperature-excursion
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?sslMode=REQUIRED
    username: ${DB_USERNAME}
    azure:
      # MySQL obtains its access token through the managed identity; do not set a datasource password.
      passwordless-enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
nimbus:
  temperature:
    default-threshold-celsius: 8.0
    warning-duration-minutes: 15
    recovery-duration-minutes: 10
    data-gap-minutes: 10
  alerts:
    email:
      enabled: ${ALERT_EMAIL_ENABLED:false}
      to: ${ALERT_EMAIL_TO:}
      from: ${ALERT_EMAIL_FROM:}
      communication-services:
        endpoint: ${AZURE_COMMUNICATION_SERVICES_ENDPOINT:}
    webhook:
      url: ${ALERT_WEBHOOK_URL:}
      # Store this Key Vault secret as ALERT-WEBHOOK-BEARER-TOKEN.
      bearer-token: ${ALERT-WEBHOOK-BEARER-TOKEN:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
