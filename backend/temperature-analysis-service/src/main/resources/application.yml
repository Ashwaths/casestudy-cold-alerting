server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict
spring:
  application:
    name: nimbus-temperature-excursion
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nimbus_freight?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:nimbus}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    operator:
      username: ${APP_USERNAME}
      password: ${APP_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
nimbus:
  temperature:
    default-threshold-celsius: 8.0
    warning-duration-minutes: 15
    recovery-duration-minutes: 10
    data-gap-minutes: 10
